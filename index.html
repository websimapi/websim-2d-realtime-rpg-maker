<!DOCTYPE html>
<html>
<head>
    <title>2D Realtime RPG Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button id="play-mode-toggle">Play Mode</button>
            <div id="texture-selector">
                <h3>Texture Tiles</h3>
                <div id="texture-gallery"></div>
                <div id="generate-texture">
                    <input type="text" id="texture-prompt" placeholder="Describe a texture...">
                    <button id="generate-texture-btn">Generate</button>
                </div>
            </div>
            <div id="tile-properties">
                <h3>Tile Properties</h3>
                <label><input type="checkbox" id="is-walkable"> Walkable</label>
                <label><input type="checkbox" id="is-teleport"> Teleport</label>
                <div id="teleport-target" style="display: none;">
                    <label>Target X: <input type="number" id="teleport-x"></label>
                    <label>Target Y: <input type="number" id="teleport-y"></label>
                </div>
            </div>
             <div id="layer-selector">
                <h3>Layer</h3>
                <select id="current-layer">
                    <option value="0">Layer 0 (Base)</option>
                    <option value="1">Layer 1</option>
                    <option value="2">Layer 2</option>
                </select>
            </div>
        </div>
        <div id="game-world">
            <canvas id="game-canvas"></canvas>
            <div id="player-container"></div>
        </div>
    </div>
    <script type="importmap">
    {
      "imports": {
        "./config.js": "./config.js",
        "./dom.js": "./dom.js",
        "./state.js": "./state.js",
        "./utils.js": "./utils.js",
        "./render.js": "./render.js",
        "./input.js": "./input.js",
        "./network.js": "./network.js",
        "./textures.js": "./textures.js",
        "./tiles.js": "./tiles.js",
        "./chunks.js": "./chunks.js"
      }
    }
    </script>

</body>
</html>
